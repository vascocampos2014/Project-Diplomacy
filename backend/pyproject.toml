[project]
name = "votoclaro-rag"
version = "0.1.0"
description = "Agentic RAG over Portuguese parliament bills and votes (VotoClaro)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "sentence-transformers>=3.3",
    "torch>=2.7",
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
]

[project.scripts]
votoclaro = "votoclaro_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/votoclaro_rag"]

# RTX 50-series (Blackwell) needs CUDA 12.8 builds of PyTorch.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
